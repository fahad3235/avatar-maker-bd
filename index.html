<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Avatar Maker BD — অ্যাভাটার মেকার বিডি</title>
<meta name="description" content="Design your own flat-style avatar offline — face, hair, eyes, glasses, hijab, cap — save to a gallery and download PNG or SVG. Bilingual English / বাংলা.">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar">
  <div class="wrap topbar-in">
    <div>
      <h1 id="title" data-i18n="appTitle">Avatar Maker BD</h1>
      <p class="tagline" data-i18n="tagline">Design your own avatar — no sign-up, no uploads, fully offline.</p>
    </div>
    <button id="langBtn" type="button" class="btn lang">বাংলা</button>
  </div>
</header>

<main class="wrap">
  <p class="combo-line"><span id="comboLine"></span></p>

  <div class="layout">
    <section class="preview-card" aria-label="Avatar preview">
      <h2 data-i18n="preview">Preview</h2>
      <div id="stage" class="stage" aria-live="polite"></div>
      <label class="name-row">
        <span data-i18n="nameLabel">Avatar name</span>
        <input id="avatarName" type="text" maxlength="30" data-i18n-ph="namePh" placeholder="e.g. Fahad" autocomplete="off">
      </label>
      <div class="btn-row">
        <button id="randomBtn" type="button" class="btn" data-i18n="random">🎲 Random</button>
        <button id="resetBtn" type="button" class="btn ghost" data-i18n="reset">↺ Reset</button>
      </div>
      <div class="btn-row">
        <button id="pngBtn" type="button" class="btn primary" data-i18n="downloadPng">⬇ PNG</button>
        <button id="svgBtn" type="button" class="btn" data-i18n="downloadSvg">⬇ SVG</button>
        <button id="copyBtn" type="button" class="btn" data-i18n="copySvg">⧉ Copy SVG</button>
      </div>
      <button id="saveBtn" type="button" class="btn primary wide" data-i18n="save">💾 Save to gallery</button>
    </section>

    <section class="controls-card" aria-label="Customise">
      <h2 data-i18n="customize">Customise</h2>
      <div id="controls"></div>
    </section>
  </div>

  <section class="gallery-card" aria-label="Saved avatars">
    <div class="gallery-head">
      <h2><span data-i18n="gallery">My avatars</span> <span id="galleryCount" class="count"></span></h2>
      <div class="btn-row">
        <button id="exportBtn" type="button" class="btn small" data-i18n="exportBtn">Export gallery</button>
        <button id="importBtn" type="button" class="btn small" data-i18n="importBtn">Import gallery</button>
        <button id="eraseBtn" type="button" class="btn small danger" data-i18n="eraseBtn">Erase all</button>
        <input id="importFile" type="file" accept="application/json,.json" hidden>
      </div>
    </div>
    <p id="galleryEmpty" class="empty" data-i18n="galleryEmpty">No saved avatars yet — design one and tap Save.</p>
    <div id="galleryGrid" class="gallery-grid"></div>
  </section>

  <footer>
    <p id="disclaimer" data-i18n="disclaimer">Your avatars stay in this browser only. PNG / SVG downloads are yours to use anywhere — profile pictures, stickers, class projects.</p>
  </footer>
</main>

<div id="toast" class="toast" hidden></div>

<script src="js/logic.js"></script>
<script src="js/data.js"></script>
<script src="js/i18n.js"></script>
<script src="js/app.js"></script>
</body>
</html>
